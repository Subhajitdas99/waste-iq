[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
mypy_path = ["app"]
warn_unused_configs = true
check_untyped_defs = true
disallow_incomplete_defs = false
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = ["jose", "jose.*"]
ignore_missing_imports = true