name: Backend CI

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

  pull_request:
    branches:
      - main
      - develop
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint, Type-Check & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: wasteiq_test
          POSTGRES_USER: wasteiq
          POSTGRES_PASSWORD: wasteiq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wasteiq -d wasteiq_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://wasteiq:wasteiq@localhost:5432/wasteiq_test
      JWT_SECRET_KEY: test_secret_key_for_ci_only_do_not_use_in_production
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      ENVIRONMENT: test
      CORS_ORIGINS: http://localhost:5173

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verify installed tools
        run: |
          python --version
          pip --version
          ruff --version
          black --version
          mypy --version
          pytest --version

      - name: Run Ruff linter
        run: |
          ruff check app tests

      - name: Check Black formatting
        run: |
          black --check app tests

      - name: Run MyPy type checker
        run: |
          mypy app

      - name: Run database migrations
        run: |
          alembic upgrade head

      - name: Run Pytest with coverage
        run: |
          pytest tests \
            -v \
            --tb=short \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=80

      - name: Upload coverage report to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: backend/coverage.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
