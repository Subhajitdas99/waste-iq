services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wasteiq
      POSTGRES_USER: wasteiq
      POSTGRES_PASSWORD: wasteiq
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wasteiq -d wasteiq"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    # /health/ready verifies both process liveness and database connectivity.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  agent:
    build:
      context: ./agent
    # Optional in local development: the agent only runs when its own .env
    # exists, so a fresh clone can still build/run the core stack.
    env_file:
      - path: ./agent/.env
        required: false
    ports:
      - "8001:8001"

volumes:
  postgres_data:
